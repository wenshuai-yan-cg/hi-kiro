name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

# ── OS Matrix Definition ──────────────────────────────────────────────────────
# To add/remove a platform, edit the matrix below.
# Fields:
#   os          : GitHub Actions runner image
#   target      : Rust target triple (empty = default)
#   label       : Human-readable platform name
#   artifact    : Artifact upload name
#   bundle_path : Path pattern for built bundles
env:
  NODE_VERSION: '20'
  RUST_CHANNEL: stable

jobs:
  # ── Build (matrix) ───────────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 1つ失敗しても他は継続
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────────────────
          - os: ubuntu-22.04
            label: Linux (x64)
            artifact: linux-bundles
            bundle_path: |
              kiro-history/src-tauri/target/release/bundle/deb/*.deb
              kiro-history/src-tauri/target/release/bundle/rpm/*.rpm
              kiro-history/src-tauri/target/release/bundle/appimage/*.AppImage
            extra_deps: |
              sudo apt-get update
              sudo apt-get install -y \
                libwebkit2gtk-4.1-dev libgtk-3-dev \
                libayatana-appindicator3-dev librsvg2-dev \
                patchelf squashfs-tools

          # ── Windows ────────────────────────────────────────────────────────
          - os: windows-latest
            label: Windows (x64)
            artifact: windows-bundles
            bundle_path: |
              kiro-history/src-tauri/target/release/bundle/msi/*.msi
              kiro-history/src-tauri/target/release/bundle/nsis/*.exe

          # ── macOS (Universal: Intel + Apple Silicon) ───────────────────────
          - os: macos-latest
            label: macOS (Universal)
            artifact: macos-bundles
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: -- --target universal-apple-darwin
            bundle_path: |
              kiro-history/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              kiro-history/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OS固有の依存パッケージ (Linux のみ)
      - name: Install system dependencies
        if: matrix.extra_deps != ''
        run: ${{ matrix.extra_deps }}
        shell: bash

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kiro-history/package-lock.json

      # Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: kiro-history/src-tauri
          key: ${{ matrix.os }}

      # Frontend
      - name: Install npm dependencies
        run: npm ci
        working-directory: kiro-history

      # ── Future: Run tests here ──────────────────────────────────────────────
      # - name: Run frontend tests
      #   run: npm test
      #   working-directory: kiro-history
      #
      # - name: Run Rust tests
      #   run: cargo test
      #   working-directory: kiro-history/src-tauri

      # Build
      - name: Build Tauri app
        run: npm run tauri build ${{ matrix.tauri_args }}
        working-directory: kiro-history

      # Upload artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.bundle_path }}

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Get version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: hi-kiro ${{ steps.ver.outputs.TAG }}
          generate_release_notes: true
          body: |
            ## hi-kiro ${{ steps.ver.outputs.TAG }}

            kiro-cli 履歴横断検索ツール (Tauri v2 + React + Rust)

            ### インストール

            **Linux (Ubuntu / Debian / WSL2)**
            ```bash
            sudo dpkg -i hi-kiro_${{ steps.ver.outputs.VERSION }}_amd64.deb
            hi-kiro
            ```

            **Windows 11** — `.msi` または `-setup.exe` をダブルクリック

            **macOS** — `.dmg` をダブルクリックしてインストール

          files: artifacts/**/*
